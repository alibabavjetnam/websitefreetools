name: Build Android APK

# Chạy tay (Actions → Build Android APK → Run workflow) hoặc khi sửa thư mục android-app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cài gói
        run: npm install
      - name: Tạo dự án Android
        run: npx cap add android
      - name: Đồng bộ
        run: npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 4v2-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
